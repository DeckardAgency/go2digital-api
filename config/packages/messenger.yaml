framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Thumbnails: sync in dev, async in prod
            App\Message\GenerateThumbnailsMessage: sync

when@prod:
    framework:
        messenger:
            routing:
                App\Message\GenerateThumbnailsMessage: async
